name: noteql-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # 内核质量闸门：检查 → 构建 → 测试，全部在真实 MoonBit 工具链上跑。
  # 其余 job 直接消费仓库内已提交的 media/core.mjs，因此不需要工具链；
  # 只有这里保证源码本身能通过 moon 的三道关。
  moonbit-core:
    name: MoonBit check / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 验收要求 moonc >= 0.10.16，版本不够就让 job 直接红
      - name: Require moonc >= 0.10.16
        run: |
          moon version --all
          v=$(moonc -v | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "moonc = $v"
          lowest=$(printf '%s\n%s\n' "0.10.16" "$v" | sort -V | head -1)
          if [ "$lowest" != "0.10.16" ]; then
            echo "::error::moonc $v is older than the required 0.10.16"
            exit 1
          fi

      - name: moon check
        run: moon -C core check --target wasm-gc

      - name: moon build
        run: |
          moon -C core build --target wasm-gc --release
          moon -C core build --target js --release

      - name: moon test
        run: moon -C core test --target wasm-gc

      - run: npm ci

      - name: TypeScript typecheck and compile
        run: |
          npm run typecheck
          npm run compile

      # 重构前后语义一致性：TypeScript 旧解析器 vs MoonBit 内核
      - name: Parse parity
        run: npm run parity

  consumer:
    name: NoteQL CLI and SARIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 直接使用仓库内已提交的 media/core.mjs，不需要 MoonBit 工具链
      - run: npm ci
      - name: NoteQL smoke
        run: node scripts/noteql-test.mjs

      - name: Batch queries to SARIF
        run: >-
          node scripts/noteql.mjs
          --vault example-vault
          --queries queries
          --format sarif > noteql.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: noteql-sarif
          path: noteql.sarif

      # 仓库开启 code scanning 后生效；未开启时不让整个 job 变红
      - name: Upload SARIF to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: noteql.sarif
          category: noteql

      # 违规类查询：docs 当前没有断链，所以此步应当为绿
      - name: Gate on docs
        run: >-
          node scripts/noteql.mjs
          --vault docs
          --file queries/unresolved.nql
          --fail-on-results

  gate-must-fail:
    name: Gate must fail on broken vault
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # 负例：example-vault 故意保留一条断链，闸门必须以退出码 2 失败
      - name: A broken link must produce exit code 2
        run: |
          set +e
          node scripts/noteql.mjs \
            --vault example-vault \
            --file queries/unresolved.nql \
            --fail-on-results
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2
